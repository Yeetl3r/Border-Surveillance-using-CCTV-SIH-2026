# The scripted demonstrations, in the order they are presented.
#
# Data, not code. Which clip each demo plays, what it claims to show, and how it
# labels what it finds are presentation decisions, and they belong somewhere a
# person can edit an hour before a presentation without touching Python.
#
# Each demo lists one or two panels. A panel binds a demo camera to a clip; the
# demo page draws each panel as a raw feed on the left and the detection feed on
# the right, so the audience can see what the model was given alongside what it
# concluded. Two panels stack vertically, first listed on top.
#
# Per-panel keys:
#   detector:  sensitivity for the perimeter model on this footage
#   aerial:    overrides for the drone detector on this footage
#   suppress:  detectors this panel does not run, because they answer a
#              question this demo is not asking
#   present:   how the panel labels and colours what it found
#
# Only the cameras a demo names are started. The rest, cam01 included, are
# stopped -- three pipelines running the detector at once would leave the one
# being watched at a third of its frame rate.

demos:
  - id: 1
    title: Weapon detection
    claim: A specialised detector on a person crop, graded by who is carrying.
    note: >
      The weapon model never sees a full frame. It runs on the person box the
      perimeter model already found, because a rifle at range is a handful of
      pixels in a wide shot and legible only once cropped to its carrier. The
      alert it raises is graded by identity, not by object: a weapon on an
      enrolled friendly is a guard on patrol.
    panels:
      - camera: demo_a
        label: RIFLE ON PATROL
        source: assets/demo/weapon_patrol.mp4
        suppress: [aerial]
        present:
          only_group: person
          box_label: "PERSON · RIFLE"
          box_threat: CRITICAL
          coast_frames: 30

  - id: 2
    title: Drone versus bird
    claim: Separating an aerial intruder from the birds that share its sky.
    note: >
      A drone detector that fires on every bird is worthless above a border.
      The stock perimeter model already carries bird as a class, trained on
      orders of magnitude more bird imagery than any drone set contains, so the
      discrimination is made between models rather than by one. The top panel is
      the sky the system has to ignore; the bottom is the one it must not.
    panels:
      - camera: demo_a
        label: BIRDS IN FLIGHT
        source: assets/demo/bird_flight.mp4
        # This panel exists to show restraint, so the aerial detector does not
        # run on it. Its output here would be a claim the demo is arguing
        # against.
        # Pose too. The crawling-human check asks whether a wide, low subject
        # resolves a human skeleton -- a bird with its wings out is exactly
        # that shape, and the check was reclassifying one of the two birds as a
        # person on this footage. It answers a question this demo is not
        # asking, and answering it wrongly cost the panel a box.
        suppress: [aerial, weapons, pose]
        detector:
          # Two birds against bright overcast at long range are close to the
          # smallest thing this model resolves, and it loses them whenever they
          # cross a bright cloud edge. The floor is dropped for this footage the
          # way it is for the crawling subject; only_group below keeps the
          # cloud texture the lower floor also finds out of the picture.
          conf: 0.08
        present:
          only_group: animal
          box_label: "AERIAL ANIMAL"
          box_threat: INFO
          # The birds never leave frame, so the gaps are detector dropouts
          # rather than the subject going away. Hold the last box across them.
          coast_frames: 120
      - camera: demo_b
        label: ARMED DRONE
        source: assets/demo/drone_hexacopter.mp4
        suppress: [weapons]
        aerial:
          # Filmed close, so the airframe fills far more of the frame than one
          # crossing a perimeter at range would.
          max_area_frac: 0.75
          conf: 0.50
          every_n_frames: 1
        present:
          aerial_label: "ARMED DRONE"
          hide_boxes: true

  - id: 3
    title: Video tampering
    claim: The camera itself is a thing that can be attacked.
    note: >
      Covering a lens leaves the detector reporting a calm, empty scene. There
      is no absolute blur threshold -- an IR night scene differs from daylight
      by more than a covered lens differs from an open one -- so the system
      learns this camera's own baseline and looks for a relative collapse, and
      requires sharpness and structure to fall together.
    extras: [evidence]
    alert_labels:
      # HEALTH_FAULT is accurate and tells an audience nothing. On this demo it
      # is the headline, so it says what actually happened.
      HEALTH_FAULT: VIDEO TAMPERED
    panels:
      - camera: demo_a
        label: LENS OBSTRUCTION
        source: assets/demo/tamper_lens.mp4
        # A lens filled by a hand is not a scene about which a weapon claim
        # should be made. Health is the subject here -- but the person doing
        # the covering is still tracked and identified, which is what puts a
        # face on the evidence record.
        suppress: [weapons, aerial]

  - id: 4
    title: Animal versus crawling human
    claim: The discrimination box geometry provably cannot make.
    note: >
      A person on hands and knees and a quadruped are the same shape, and the
      class label is no better -- a detector trained on upright people calls a
      crawling person an animal. Above a configured aspect ratio the label is
      not trusted and the pose model is asked whether it sees a human. The herd
      above is what a perimeter must learn to ignore; the subject below is what
      it must not.
    panels:
      - camera: demo_a
        label: ELEPHANT HERD
        source: assets/demo/animal_elephants.mp4
        suppress: [aerial, weapons]
        present:
          only_group: animal
          box_label: "ANIMAL · HERD"
          box_threat: INFO
      - camera: demo_b
        label: HUMAN CRAWLING
        source: assets/demo/human_crawl.mp4
        suppress: [aerial, weapons]
        detector:
          # A person on hands and knees presents almost none of the upright
          # silhouette the detector was trained on. MEASURED on this clip, the
          # subject is found in 40% of frames at 0.10 and 49% at 0.06, and the
          # longest gap falls from ~80 frames to ~60. The same floor on a
          # perimeter camera would flood the tracker, which is exactly why this
          # is a per-panel setting.
          conf: 0.06
        present:
          # The low floor also finds a great deal of foliage. Only the subject
          # this demo is about is drawn.
          only_group: person
          box_label: "PERSON · CRAWLING"
          box_threat: CRITICAL
          # Foliage repeatedly occludes the subject, and the longest measured
          # gap is about 60 frames. Hold the last box across those gaps rather
          # than blinking it in and out -- the tracker already keeps the
          # identity alive for longer than this.
          coast_frames: 90

  - id: 5
    title: Full analysis run
    claim: Everything at once, on the footage the system was built around.
    note: >
      The complete pipeline on a surveyed camera -- ground-plane geometry, a
      directional tripwire, a restricted zone, a protected asset, open-set
      identity and the evidence record behind every alert. Ask it a question
      below and it answers from the alert log rather than from the video.
    extras: [ask, evidence]
    panels:
      - camera: cam01
        label: CAM-01 // NORTH APPROACH
        source: assets/sample_border.mp4
        suppress: [aerial, weapons]

  - id: 6
    title: Live device camera
    claim: The same pipeline, on a feed with no recording behind it.
    note: >
      Nothing downstream changes for a live source -- geometry, confirmation,
      identity and evidence behave exactly as they do for a file. The transport
      bar hides itself, because pause and seek have no meaning on a live feed
      and controls that silently do nothing are worse than none.
    panels:
      - camera: demo_a
        label: DEVICE CAMERA
        source: "device:0"
