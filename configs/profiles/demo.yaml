# DEMO profile -- values tuned for a live presentation, not for the field.
#
# The difference between this file and operational.yaml is the honest answer to
# "why did that fire in 15 seconds?" State the operational default aloud while
# running the short one.

baggage:
  dwell_s: 15.0           # operational default is 120 s -- nobody watches a
                          # two-minute timer on stage

confirm:
  window_s: 1.2           # shorter confirmation so events land inside a demo
  min_ratio: 0.6
  min_hits: 2

alerts:
  clear_after_s: 5.0
  expire_after_s: 240.0

health:
  consecutive_bad: 3      # trip faster so the lens-cover demo is crisp

identity:
  embed_every_n_frames: 4 # more responsive identity on short clips

runtime:
  target_fps: 25.0

# --- the four demo paths -------------------------------------------------
# Each of these is off in system.yaml and on here, because each costs
# something at runtime and each is a claim the system should not make by
# default. Turning them on is a demo decision, stated in one place.

pose:
  # Demo 4 (animal versus crawling human) runs through PoseEstimator.
  # disambiguate(), which needs the model loaded. Note that enabling pose also
  # enables the STANCE_ANOMALY path -- that is the documented high-false-alarm
  # signal, and on a demo clip it is worth the risk; in the field it is not.
  enabled: true

threat:
  weapons:
    # Demo 2. Needs weights/weapons_yolo26n.pt -- startup fails loudly if it is
    # missing rather than running a demo where nothing ever fires.
    enabled: true
  aerial:
    # Demo 3. Needs weights/drones_yolo26n.pt.
    enabled: true
    every_n_frames: 1     # a drone crosses frame quickly; do not skip frames
